name: test action
on:
  push:
    branches:
      - v1
      - v1-actions-test
  workflow_dispatch:

jobs:
  install:
    strategy:
      matrix:
        env:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
          - runner: macos-latest
    name: test action
    runs-on: ${{ matrix.env.runner }}
    steps:
      - uses: fujiwara/lambroll@v1-actions-test
        with:
          version: v1.0.4
      - run: |
          lambroll version 2>&1 | fgrep v1.0.4
      - uses: fujiwara/lambroll@v1
        with:
          version: v1.0.5
      - run: |
          lambroll version 2>&1 | fgrep v1.0.5
      - run: |
          echo 1.1.3 > .test-lambroll-version
      - uses: fujiwara/lambroll@v1-actions-test
        with:
          version-file: .test-lambroll-version
      - run: |
          lambroll version 2>&1 | fgrep v1.1.3

      - uses: fujiwara/lambroll@v1-actions-test
        with:
          version: v1.3.2
          args: version
