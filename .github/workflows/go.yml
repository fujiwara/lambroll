name: Go
on:
  pull_request:
  push:
    branches: ["v1"]
jobs:
  test:
    strategy:
      matrix:
        go:
          - "1.26"
          - "1.27"
    name: Build
    runs-on: ubuntu-latest

    services:
      floci:
        image: floci/floci@sha256:4060e0f8ded3cf0f53bde641ce6b8d2ec8a6355d936cc856ac806cc88dda1a49 # 1.5.21
        ports:
          - 4566:4566

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: go.sum
        id: go

      - name: Build & Test
        run: |
          echo $PATH
          make clean
          make test
        env:
          TZ: Asia/Tokyo

      - name: create test
        run: |
          make
          ./cmd/lambroll/lambroll deploy \
            --function test/function.json \
            --src test/src \
            --endpoint http://127.0.0.1:4566 \
            --tfstate test/terraform.tfstate \
            --prefixed-tfstate "prefix1_=test/terraform_1.tfstate" \
            --prefixed-tfstate "prefix2_=test/terraform_2.tfstate" \
            --log-level debug
        env:
          FUNCTION_NAME: hello
          AWS_REGION: ap-northeast-1
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          WORLD: a

      - name: deploy test
        run: |
          make
          ./cmd/lambroll/lambroll deploy \
            --function test/function.json \
            --src test/src \
            --endpoint http://127.0.0.1:4566 \
            --tfstate test/terraform.tfstate \
            --prefixed-tfstate "prefix1_=test/terraform_1.tfstate" \
            --prefixed-tfstate "prefix2_=test/terraform_2.tfstate" \
            --log-level debug
        env:
          FUNCTION_NAME: hello
          AWS_REGION: ap-northeast-1
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          WORLD: a
